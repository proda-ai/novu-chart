ingress:
  enabled: false
  className: ""
  annotations: {}
  host: chart-example.local
  tls:
    secretName: novu-tls
  dashboard:
    subdomain: dashboard
    annotations: {}


service:
  type: ClusterIP

secret:
  create: true

dashboard:
  replicaCount: 1
  image:
    repository: ghcr.io/novuhq/novu/dashboard
    pullPolicy: IfNotPresent
    tag: ""
  port: 4000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

api:
  replicaCount: 1
  image:
    repository: ghcr.io/novuhq/novu/api
    pullPolicy: IfNotPresent
    tag: ""
  port: 3000
  resources: {}
  contextPath: ""
  idempotencyEnabled: false
  rateLimitingEnabled: false
  newMessagesApiResponseEnabled: false
  widgetBaseUrl: ""

worker:
  replicaCount: 1
  port: 3004
  image:
    repository: ghcr.io/novuhq/novu/worker
    pullPolicy: IfNotPresent
    tag: ""
  resources: {}
  broadcastQueueChunkSize: 100
  multicastQueueChunkSize: 100

ws:
  replicaCount: 1
  image:
    repository: ghcr.io/novuhq/novu/ws
    pullPolicy: IfNotPresent
    tag: ""
  port: 3002
  contextPath: ""
  resources: {}

global:
  imagePullSecrets: []
  security:
    allowInsecureImages: true
  env:
    nodeEnv: production
    isSelfHosted: true
    novuEnterprise: false
    isV2Enabled: true
    logLevel: info
    safeOutboundAllow: ""
    websocketUrl: ""
    mongodb:
      maxPoolSize: 200
      minPoolSize: 10
      autoCreateIndexes: true
    secret:
      novuSecretKey: your-secret
      jwtSecret: your-secret
      storageKey: <ENCRYPTION_KEY_MUST_BE_32_LONG>
    s3:
      localStack: false
      bucketName: your-bucket-name
      region: your-region
    aws:
      accessKeyId: your-access-key-id
      secretAccessKey: your-secret-access-key
    sentry:
      dsn: your-sentry-dsn
    newRelic:
      enabled: false
      appName: your-new-relic-app-name
      licenseKey: your-new-relic-license-key
    apiRootUrl: http://localhost:3000
    disableUserRegistration: false
    frontBaseUrl: http://localhost:4000

redis:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
  replica:
    replicaCount: 1

mongodb:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/mongodb
  serviceBindings:
    enabled: true

upgrade:
  enabled: false
  migratedOperationId: ""
  freshInstall: false
  centralize:
    approved: false
  report:
    enabled: false
  recheck:
    enabled: false
    previousApiKeySecretName: ""
    previousApiKeySecretKey: api-key
  image: ""
  deployEnv: ""
  bucket: ""
  serviceAccountName: novu-upgrade
  operationStateName: novu-upgrade-state
  operationId: ""
  attemptId: ""
  syncRevision: ""
  mode: upgrade
  indexDrops: []
  infobipIntegrationIds: []
  workVolumeSize: 40Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
      ephemeral-storage: 10Gi
    limits:
      cpu: "2"
      memory: 4Gi
      ephemeral-storage: 45Gi
  deadlines:
    quiesce: 360
    backup: 600
    verify: 900
    centralize: 900
    precheck: 300
    migrate: 900
    reconcile-indexes: 600
    smoke: 300
    failure: 300
  smoke:
    minWorkflows: 7
    noConsumersApproved: false
    subscriberId: ""
    applicationIdentifier: ""
    apiKeySecretName: ""
    apiKeySecretKey: api-key
