# yaml-language-server: $schema=./values.schema.json

ingress:
  enabled: false
  className: ""
  annotations: { }
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  host: chart-example.local
  tls:
    secretName: novu-tls
  # Dashboard access restrictions must not block browser API/WS traffic.
  dashboard:
    annotations: {}
    # tls:
    #   secretName: ""


service:
  type: ClusterIP

dashboard:
  replicaCount: 1
  image:
    repository: ghcr.io/novuhq/novu/dashboard
    pullPolicy: IfNotPresent
    tag: ""
  port: 4000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

api:
  replicaCount: 1
  image:
    repository: ghcr.io/novuhq/novu/api
    pullPolicy: IfNotPresent
    tag: ""
  port: 3000
  resources: { }
  contextPath: ""
  idempotencyEnabled: false
  rateLimitingEnabled: false
  newMessagesApiResponseEnabled: true
  widgetBaseUrl: ""

worker:
  replicaCount: 1
  port: 3004
  image:
    repository: ghcr.io/novuhq/novu/worker
    pullPolicy: IfNotPresent
    tag: ""
  resources: { }
  broadcastQueueChunkSize: 100
  multicastQueueChunkSize: 100

ws:
  replicaCount: 1
  image:
    repository: ghcr.io/novuhq/novu/ws
    pullPolicy: IfNotPresent
    tag: ""
  port: 3002
  contextPath: ""
  resources: { }

global:
  imagePullSecrets: [ ]
  security:
    allowInsecureImages: true
  env:
    nodeEnv: production
    isSelfHosted: true
    novuEnterprise: false
    isV2Enabled: true
    logLevel: info
    # Private bridge addresses are rejected by Novu's outbound SSRF guard unless allowed.
    safeOutboundAllow: ".svc.cluster.local"
    websocketUrl: http://localhost:3002
    mongodb:
      maxPoolSize: 50
      minPoolSize: 10
      autoCreateIndexes: true
    secret:
      novuSecretKey: your-secret
      jwtSecret: your-secret
      storageKey: <ENCRYPTION_KEY_MUST_BE_32_LONG>
    s3:
      localStack: false
      bucketName: your-bucket-name
      region: your-region
    aws:
      accessKeyId: your-access-key-id
      secretAccessKey: your-secret-access-key
    sentry:
      dsn: your-sentry-dsn
    newRelic:
      enabled: false
      appName: your-new-relic-app-name
      licenseKey: your-new-relic-license-key
    apiRootUrl: http://localhost:3000
    disableUserRegistration: false
    frontBaseUrl: http://localhost:4000

redis:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
  replica:
    replicaCount: 1

mongodb:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/mongodb
  serviceBindings:
    enabled: true
