apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "novu.ws.fullname" . }}
  labels:
    app: {{ include "novu.name" . }}
    component: ws
spec:
  replicas: {{ .Values.ws.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "novu.name" . }}
      component: ws
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        app: {{ include "novu.name" . }}
        component: ws
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ws
          image: "{{ .Values.ws.image.repository }}:{{ .Values.ws.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.ws.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ws.port }}
          envFrom:
            - configMapRef:
                name: {{ include "novu.fullname" . }}-config
            - secretRef:
                name: {{ include "novu.fullname" . }}-secret
          env:
            - name: PORT
              value: "{{ .Values.ws.port }}"
            - name: WS_CONTEXT_PATH
              value: {{ .Values.ws.contextPath | trimAll "/" | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ include "redis.fullname" . }}"
                  key: redis-password
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "mongodb.fullname" . }}-svcbind-root
                  key: uri
          resources:
            {{- toYaml .Values.ws.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: {{ printf "%s/v1/health-check" (printf "/%s" (.Values.ws.contextPath | trimAll "/") | trimSuffix "/") | quote }}
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: {{ printf "%s/v1/health-check" (printf "/%s" (.Values.ws.contextPath | trimAll "/") | trimSuffix "/") | quote }}
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: {{ printf "%s/v1/health-check" (printf "/%s" (.Values.ws.contextPath | trimAll "/") | trimSuffix "/") | quote }}
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      restartPolicy: Always
