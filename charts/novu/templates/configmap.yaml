apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "novu.fullname" . }}-config
  labels:
    app: {{ include "novu.name" . }}
    component: config
data:
  IS_SELF_HOSTED: {{ .Values.global.env.isSelfHosted | quote }}
  NOVU_ENTERPRISE: {{ .Values.global.env.novuEnterprise | quote }}
  LOG_LEVEL: {{ .Values.global.env.logLevel | quote }}
  NEW_RELIC_ENABLED: {{ .Values.global.env.newRelic.enabled | quote }}
  NODE_ENV: {{ .Values.global.env.nodeEnv | quote }}
  MONGO_MIN_POOL_SIZE: {{ .Values.global.env.mongodb.minPoolSize | quote }}
  MONGO_MAX_POOL_SIZE: {{ .Values.global.env.mongodb.maxPoolSize | quote }}
  MONGO_AUTO_CREATE_INDEXES: {{ .Values.global.env.mongodb.autoCreateIndexes | quote }}
  REDIS_HOST: "{{ include "redis.fullname" . }}-master.{{ .Release.Namespace }}.svc.cluster.local"
  REDIS_PORT: {{ .Values.redis.master.service.ports.redis | quote }}
  REDIS_CACHE_SERVICE_HOST: "{{ include "redis.fullname" . }}-master"
  REDIS_CACHE_SERVICE_PORT: {{ .Values.redis.master.service.ports.redis | quote }}
  S3_LOCAL_STACK: {{ .Values.global.env.s3.localStack | quote }}
  S3_BUCKET_NAME: {{ .Values.global.env.s3.bucketName | quote }}
  S3_REGION: {{ .Values.global.env.s3.region | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.global.env.aws.accessKeyId | quote }}
  NEW_RELIC_APP_NAME: {{ .Values.global.env.newRelic.appName | quote }}
  API_ROOT_URL: {{ .Values.global.env.apiRootUrl | quote }}
  REDIS_DB_INDEX: "2"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "novu.fullname" . }}-dashboard-config
  labels:
    app: {{ include "novu.name" . }}
    component: dashboard
data:
  VITE_API_HOSTNAME: {{ .Values.global.env.apiRootUrl | quote }}
  {{- $websocketUrl := printf "http://localhost:%v" .Values.ws.port }}
  {{- if .Values.ingress.enabled }}
  {{- $websocketUrl = printf "%s://ws.%s" (ternary "https" "http" (not (empty .Values.ingress.tls))) .Values.ingress.host }}
  {{- end }}
  VITE_WEBSOCKET_HOSTNAME: {{ .Values.global.env.websocketUrl | default $websocketUrl | quote }}
