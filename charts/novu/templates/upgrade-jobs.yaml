{{- if and .Values.upgrade.enabled .Values.upgrade.recheck.enabled }}{{ fail "Recheck requires upgrade.enabled=false" }}{{- end }}
{{- if include "novu.reportOnly" . }}
{{- if .Values.upgrade.enabled }}{{ fail "The report runs from a separate Application with the upgrade disarmed (upgrade.enabled=false)" }}{{- end }}
{{- if .Values.upgrade.recheck.enabled }}{{ fail "Report-only mode requires upgrade.recheck.enabled=false" }}{{- end }}
{{- if or .Values.mongodb.enabled .Values.redis.enabled }}{{ fail "Report-only mode requires mongodb.enabled=false and redis.enabled=false" }}{{- end }}
{{- end }}
{{- if or .Values.upgrade.enabled .Values.upgrade.report.enabled .Values.upgrade.recheck.enabled }}
{{- if ne .Release.Namespace "novu" }}{{ fail "Upgrade hooks are scoped to namespace novu" }}{{- end }}
{{- if ne (include "novu.fullname" .) "novu" }}{{ fail "Upgrade hooks require release fullname novu to match L1 RBAC" }}{{- end }}
{{- $image := required "upgrade.image requires an immutable runner digest" .Values.upgrade.image }}
{{- if not (regexMatch "^[^[:space:]]+@sha256:[a-f0-9]{64}$" $image) }}{{ fail "upgrade.image must use @sha256" }}{{- end }}
{{- $operation := required "upgrade.operationId is required" .Values.upgrade.operationId }}
{{- $attempt := required "upgrade.attemptId is required" .Values.upgrade.attemptId }}
{{- $revision := required "upgrade.syncRevision is a full reviewed Argo source SHA" .Values.upgrade.syncRevision }}
{{- $steps := list }}
{{- range $key, $value := .Values.upgrade.smoke }}
{{- if or (empty $value) (regexMatch "^(SMOKE_|REPLACE_)" $value) }}{{ fail (printf "upgrade.smoke.%s requires a resolved smoke input" $key) }}{{- end }}
{{- end }}
{{- with .Values.upgrade.recheck.previousApiKeySecretName }}
{{- if not $.Values.upgrade.recheck.enabled }}{{ fail "upgrade.recheck.previousApiKeySecretName applies only to upgrade.recheck.enabled=true" }}{{- end }}
{{- range $key := list "previousApiKeySecretName" "previousApiKeySecretKey" }}
{{- $value := index $.Values.upgrade.recheck $key }}
{{- if or (empty $value) (regexMatch "^(SMOKE_|REPLACE_)" $value) }}{{ fail (printf "upgrade.recheck.%s requires a resolved smoke input" $key) }}{{- end }}
{{- end }}
{{- end }}
{{- if or .Values.upgrade.enabled .Values.upgrade.recheck.enabled }}
{{- if ne .Values.upgrade.mode "upgrade" }}{{ fail "Restore uses R1's old chart plus standalone restore Jobs; never render 3.19 workloads in restore mode" }}{{- end }}
{{- if .Values.global.env.mongodb.autoCreateIndexes }}{{ fail "Upgrade requires global.env.mongodb.autoCreateIndexes=false" }}{{- end }}
{{- end }}
{{- if .Values.upgrade.enabled }}
{{- $steps = list
  (dict "name" "quiesce" "phase" "PreSync" "wave" "-60")
  (dict "name" "backup" "phase" "PreSync" "wave" "-50")
  (dict "name" "verify" "phase" "PreSync" "wave" "-40")
  (dict "name" "centralize" "phase" "PreSync" "wave" "-35")
  (dict "name" "precheck" "phase" "PreSync" "wave" "-30")
  (dict "name" "migrate" "phase" "PreSync" "wave" "-20")
  (dict "name" "reconcile-indexes" "phase" "PreSync" "wave" "-10")
  (dict "name" "smoke" "phase" "PostSync" "wave" "10")
  (dict "name" "failure" "phase" "SyncFail" "wave" "0") }}
{{- end }}
{{- if .Values.upgrade.report.enabled }}
{{- $steps = append $steps (dict "name" "report" "step" "precheck" "mode" "report") }}
{{- end }}
{{- if .Values.upgrade.recheck.enabled }}
{{- $steps = append $steps (dict "name" "recheck" "step" "smoke" "mode" "recheck") }}
{{- end }}
{{- range $step := $steps }}
{{- if or (ne $step.name "centralize") $.Values.upgrade.centralize.approved }}
{{- $command := default $step.name $step.step }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: novu-upgrade-{{ $step.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "novu.labels" $ | nindent 4 }}
    tags.datadoghq.com/env: staging
    tags.datadoghq.com/service: novu-upgrade
  {{- if $step.phase }}
  annotations:
    argocd.argoproj.io/hook: {{ $step.phase }}
    argocd.argoproj.io/sync-wave: {{ $step.wave | quote }}
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  {{- end }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ index $.Values.upgrade.deadlines $command }}
  {{- if not $step.phase }}
  ttlSecondsAfterFinished: 86400
  {{- end }}
  template:
    metadata:
      labels:
        tags.datadoghq.com/env: staging
        tags.datadoghq.com/service: novu-upgrade
      annotations:
        ad.datadoghq.com/runner.logs: '[{"source":"nodejs","service":"novu-upgrade"}]'
    spec:
      serviceAccountName: {{ $.Values.upgrade.serviceAccountName }}
      automountServiceAccountToken: true
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      containers:
        - name: runner
          image: {{ $image | quote }}
          imagePullPolicy: IfNotPresent
          args: [{{ $command | quote }}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml $.Values.upgrade.resources | nindent 12 }}
          env:
            - name: OPERATION_ID
              value: {{ $operation | quote }}
            - name: ATTEMPT_ID
              value: {{ $attempt | quote }}
            - name: SYNC_REVISION
              value: {{ $revision | quote }}
            - name: RUNNER_IMAGE
              value: {{ $image | quote }}
            - name: BACKUP_BUCKET
              value: {{ $.Values.upgrade.bucket | quote }}
            - name: STATE_CONFIGMAP
              value: {{ $.Values.upgrade.operationStateName | quote }}
            - name: MODE
              value: {{ default "upgrade" $step.mode }}
            {{- if eq $step.name "centralize" }}
            - name: CENTRALIZE_APPROVED
              value: "true"
            {{- end }}
            - name: WORK_DIR
              value: /work
            - name: INFOBIP_INTEGRATION_IDS_JSON
              value: {{ $.Values.upgrade.infobipIntegrationIds | toJson | quote }}
            - name: INDEX_DROPS_JSON
              value: {{ $.Values.upgrade.indexDrops | toJson | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: novu-mongodb-svcbind-root
                  key: uri
            - name: REDIS_HOST
              value: novu-redis-master
            - name: REDIS_PORT
              value: {{ dig "master" "service" "ports" "redis" 6379 $.Values.redis | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: novu-redis
                  key: redis-password
            - name: STORE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: novu-secret
                  key: STORE_ENCRYPTION_KEY
            - name: MONGO_AUTO_CREATE_INDEXES
              value: "false"
            - name: MIGRATION
              value: "true"
            {{- if has $step.name (list "quiesce" "report" "smoke" "recheck") }}
            - name: SMOKE_SUBSCRIBER_ID
              value: {{ $.Values.upgrade.smoke.subscriberId | quote }}
            - name: SMOKE_APPLICATION_IDENTIFIER
              value: {{ $.Values.upgrade.smoke.applicationIdentifier | quote }}
            - name: SMOKE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.upgrade.smoke.apiKeySecretName | quote }}
                  key: {{ $.Values.upgrade.smoke.apiKeySecretKey | quote }}
            - name: API_URL
              value: {{ printf "http://novu-api:%v%s" $.Values.api.port (printf "/%s" ($.Values.api.contextPath | trimAll "/") | trimSuffix "/") | quote }}
            - name: WS_URL
              value: {{ printf "http://novu-ws:%v%s" $.Values.ws.port (printf "/%s" ($.Values.ws.contextPath | trimAll "/") | trimSuffix "/") | quote }}
            {{- end }}
            {{- if and (eq $step.name "recheck") $.Values.upgrade.recheck.previousApiKeySecretName }}
            - name: SMOKE_PREVIOUS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.upgrade.recheck.previousApiKeySecretName | quote }}
                  key: {{ $.Values.upgrade.recheck.previousApiKeySecretKey | quote }}
            {{- end }}
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: work
          emptyDir:
            sizeLimit: {{ $.Values.upgrade.workVolumeSize }}
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
{{- end }}
{{- end }}
{{- end }}
