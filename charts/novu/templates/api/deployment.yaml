{{- if not (include "novu.reportOnly" .) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "novu.api.fullname" . }}
  labels:
    app: {{ include "novu.name" . }}
    component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "novu.name" . }}
      component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        app: {{ include "novu.name" . }}
        component: api
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: {{ include "novu.fullname" . }}-config
            - secretRef:
                name: {{ include "novu.fullname" . }}-secret
          env:
            - name: IS_V2_ENABLED
              value: {{ .Values.global.env.isV2Enabled | quote }}
            - name: NOVU_SAFE_OUTBOUND_ALLOW
              value: {{ .Values.global.env.safeOutboundAllow | quote }}
            - name: DASHBOARD_URL
              value: {{ .Values.global.env.frontBaseUrl | quote }}
            - name: API_CONTEXT_PATH
              value: {{ .Values.api.contextPath | trimAll "/" | quote }}
            - name: WIDGET_BASE_URL
              value: {{ .Values.api.widgetBaseUrl | quote }}
            - name: IS_API_IDEMPOTENCY_ENABLED
              value: {{ .Values.api.idempotencyEnabled | quote }}
            - name: IS_API_RATE_LIMITING_ENABLED
              value: {{ .Values.api.rateLimitingEnabled | quote }}
            - name: IS_NEW_MESSAGES_API_RESPONSE_ENABLED
              value: {{ .Values.api.newMessagesApiResponseEnabled | quote }}
            - name: DISABLE_USER_REGISTRATION
              value: "{{ .Values.global.env.disableUserRegistration }}"
            - name: FRONT_BASE_URL
              value: "{{ .Values.global.env.frontBaseUrl }}"
            - name: PORT
              value: "{{ .Values.api.port }}"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ include "redis.fullname" . }}"
                  key: redis-password
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "mongodb.fullname" . }}-svcbind-root
                  key: uri
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: {{ printf "%s/v1/health-check" (printf "/%s" (.Values.api.contextPath | trimAll "/") | trimSuffix "/") | quote }}
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: {{ printf "%s/v1/health-check" (printf "/%s" (.Values.api.contextPath | trimAll "/") | trimSuffix "/") | quote }}
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: {{ printf "%s/v1/health-check" (printf "/%s" (.Values.api.contextPath | trimAll "/") | trimSuffix "/") | quote }}
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      restartPolicy: Always
{{- end }}
