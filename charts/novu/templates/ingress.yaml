{{- if not (include "novu.reportOnly" .) -}}
{{- if .Values.ingress.enabled -}}
{{- $fullName := include "novu.fullname" . -}}
{{- $svcPortApi := .Values.api.port -}}
{{- $svcPortDashboard := .Values.dashboard.port -}}
{{- $svcPortWs := .Values.ws.port -}}
{{- if and .Values.ingress.className (not (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion)) }}
  {{- if not (hasKey .Values.ingress.annotations "kubernetes.io/ingress.class") }}
  {{- $_ := set .Values.ingress.annotations "kubernetes.io/ingress.class" .Values.ingress.className}}
  {{- end }}
{{- end }}
{{- $dashboard := .Values.ingress.dashboard | default dict }}
{{- $dashboardAnnotations := mustMergeOverwrite (deepCopy (.Values.ingress.annotations | default dict)) ($dashboard.annotations | default dict) }}
{{- $dashboardTls := $dashboard.tls | default dict }}
{{- $apiVersion := "extensions/v1beta1" }}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion }}
{{- $apiVersion = "networking.k8s.io/v1" }}
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion }}
{{- $apiVersion = "networking.k8s.io/v1beta1" }}
{{- end }}
apiVersion: {{ $apiVersion }}
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "novu.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if and .Values.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - api.{{ .Values.ingress.host }}
      secretName: api.{{ .Values.ingress.tls.secretName }}
    - hosts:
        - ws.{{ .Values.ingress.host }}
      secretName: ws.{{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: api.{{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "novu.api.fullname" . }}
                port:
                  number: {{ $svcPortApi }}
    - host: ws.{{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "novu.ws.fullname" . }}
                port:
                  number: {{ $svcPortWs }}
---
apiVersion: {{ $apiVersion }}
kind: Ingress
metadata:
  name: {{ $fullName }}-dashboard
  labels:
    {{- include "novu.labels" . | nindent 4 }}
  {{- with $dashboardAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if and .Values.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - dashboard.{{ .Values.ingress.host }}
      secretName: {{ $dashboardTls.secretName | default (printf "dashboard.%s" .Values.ingress.tls.secretName) }}
  {{- end }}
  rules:
    - host: dashboard.{{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "novu.dashboard.fullname" . }}
                port:
                  number: {{ $svcPortDashboard }}
{{- end }}
{{- end }}
