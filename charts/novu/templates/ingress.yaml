{{- if .Values.ingress.enabled -}}
{{- $fullName := include "novu.fullname" . -}}
{{- if and .Values.ingress.className (not (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion)) }}
  {{- if not (hasKey .Values.ingress.annotations "kubernetes.io/ingress.class") }}
  {{- $_ := set .Values.ingress.annotations "kubernetes.io/ingress.class" .Values.ingress.className}}
  {{- end }}
{{- end }}
{{- range $component := list "api" "web" "ws" }}
{{- $overrides := get $.Values.ingress $component | default dict }}
{{- $annotations := mustMergeOverwrite (deepCopy ($.Values.ingress.annotations | default dict)) ($overrides.annotations | default dict) }}
{{- $tlsOverrides := $overrides.tls | default dict }}
---
{{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" $.Capabilities.KubeVersion.GitVersion }}
apiVersion: networking.k8s.io/v1beta1
{{- else }}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ $fullName }}-{{ $component }}
  labels:
    {{- include "novu.labels" $ | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if and $.Values.ingress.className (semverCompare ">=1.18-0" $.Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ $.Values.ingress.className }}
  {{- end }}
  {{- if $.Values.ingress.tls }}
  tls:
    - hosts:
        - {{ $component }}.{{ $.Values.ingress.host }}
      secretName: {{ $tlsOverrides.secretName | default (printf "%s.%s" $component $.Values.ingress.tls.secretName) }}
  {{- end }}
  rules:
    - host: {{ $component }}.{{ $.Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include (printf "novu.%s.fullname" $component) $ }}
                port:
                  number: {{ (get $.Values $component).port }}
{{- end }}
{{- end }}
