{{- if not (include "novu.reportOnly" .) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "novu.dashboard.fullname" . }}
  labels:
    app: {{ include "novu.name" . }}
    component: dashboard
spec:
  type: ClusterIP
  selector:
    app: {{ include "novu.name" . }}
    component: dashboard
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.dashboard.port }}
      targetPort: http
{{- end }}
