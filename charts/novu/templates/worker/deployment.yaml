{{- if not (include "novu.reportOnly" .) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "novu.worker.fullname" . }}
  labels:
    app: {{ include "novu.name" . }}
    component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "novu.name" . }}
      component: worker
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        app: {{ include "novu.name" . }}
        component: worker
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.worker.port }}
          envFrom:
            - configMapRef:
                name: {{ include "novu.fullname" . }}-config
            - secretRef:
                name: {{ include "novu.fullname" . }}-secret
          env:
            - name: IS_V2_ENABLED
              value: {{ .Values.global.env.isV2Enabled | quote }}
            - name: NOVU_SAFE_OUTBOUND_ALLOW
              value: {{ .Values.global.env.safeOutboundAllow | quote }}
            - name: PORT
              value: {{ .Values.worker.port | quote }}
            - name: API_ROOT_URL
              value: "http://{{ include "novu.api.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.api.port }}{{ with .Values.api.contextPath | trimAll "/" }}/{{ . }}{{ end }}"
            - name: BROADCAST_QUEUE_CHUNK_SIZE
              value: "{{ .Values.worker.broadcastQueueChunkSize }}"
            - name: MULTICAST_QUEUE_CHUNK_SIZE
              value: "{{ .Values.worker.multicastQueueChunkSize }}"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ include "redis.fullname" . }}"
                  key: redis-password
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "mongodb.fullname" . }}-svcbind-root
                  key: uri
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /v1/health-check
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /v1/health-check
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /v1/health-check
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      restartPolicy: Always
{{- end }}
